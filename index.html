<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El PNG va primero: Chrome no pinta un SVG con máscara en la pestaña,
         deja el ícono en blanco y pone la inicial del <title> (la C de
         conext). Pasa justo al volver del checkout de Dodo, que recarga el
         favicon. El SVG sigue detrás, ya sin máscara, para quien sí lo dibuja.
         El apple-touch-icon va aparte: iOS compone la transparencia sobre negro. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/conext-mark.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Satoshi se sirve desde acá y no desde Google Fonts, que era de donde
         venía Inter. Un `<link>` a un CDN de fuentes es una hoja de estilo
         bloqueante en otro dominio: hay que resolver DNS, abrir TLS y recién
         ahí enterarse de cuál es el archivo de la fuente. Con el preload al
         mismo origen la descarga arranca con el HTML.
         `crossorigin` no es opcional aunque sea del mismo origen: sin él el
         navegador se baja el archivo dos veces. -->
    <link rel="preload" href="/fonts/satoshi-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="robots" content="noindex, nofollow" />
    <title>conext</title>
    <script>
      // Antes de pintar nada: si el tema elegido es el oscuro, el atributo tiene
      // que estar puesto ya, o cada recarga arranca con un fogonazo blanco
      // (index.css define el tema claro en `:root` pelado) hasta que React monta.
      try {
        var t = localStorage.getItem('wsp-crm:theme')
        if (t === 'dark') document.documentElement.dataset.theme = 'dark'
      } catch (e) {}
      // Adentro de la app de escritorio hay una barra de título propia y la
      // altura de la ventana no es toda para la dashboard. El preload corre
      // antes que esto, así que `window.conext` ya está: puesto acá, el alto
      // sale bien en el primer cuadro y no hay un salto de 32px al montar.
      if (window.conext && window.conext.escritorio) {
        document.documentElement.dataset.escritorio = ''
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
