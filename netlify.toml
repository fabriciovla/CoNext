[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.conext.lat/*"
  to = "https://conext.lat/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

[[redirects]]
  from = "/es"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/clientes"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/clientes"
  to = "/en"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/home"
  to = "/en"
  status = 301

[[redirects]]
  from = "/feed"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/feed"
  to = "/en"
  status = 301

[[redirects]]
  from = "/comments/feed"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/comments/feed"
  to = "/en"
  status = 301

[[headers]]
  for = "/app"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/en/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/en/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
