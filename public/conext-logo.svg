<svg xmlns="http://www.w3.org/2000/svg" viewBox="233.726 -642 3762.306 654" fill="currentColor" role="img" aria-label="conext">
  <!--
    El logotipo de conext: la marca —dos formas superpuestas, registros y
    contexto en capas— y el nombre en Satoshi Medium. Es el mismo dibujo que
    `Logo.jsx` lleva en línea; si se retoca, van los tres (este archivo y las
    dos copias del componente).

    Las letras son contornos, no `<text>`: el `d` de cada una sale de la tabla
    `glyf` del TTF. Así el archivo no depende de que la fuente esté instalada
    ni de que Google Fonts responda.

    El `viewBox` está ajustado a la tinta y no a la caja tipográfica: como
    `h-* w-auto` mide el viewBox, con la caja de la fuente el logotipo se
    dibujaría más chico de lo pedido y flotando sobre su propia línea de base.

    Este archivo existe para lo que no puede llevar el SVG en línea (prensa).
    Dentro de la app o del sitio va el componente: como `<img>` el logotipo se
    pinta aislado y no puede tomar el color del tema.
  -->
  <defs>
    <mask id="marca-logo" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff" />
      <g fill="#000" stroke="#000" stroke-width="30">
        <rect x="119" y="205" width="190" height="190" rx="74" ry="74" transform="rotate(8 214 300)" />
      </g>
    </mask>
  </defs>
  <g transform="translate(0 -880.334) scale(2.169)">
    <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
      <g mask="url(#marca-logo)">
        <rect x="197" y="127" width="190" height="190" rx="74" ry="74" transform="rotate(-12 292 222)" />
      </g>
      <rect x="119" y="205" width="190" height="190" rx="74" ry="74" transform="rotate(8 214 300)" />
    </g>
  </g>
