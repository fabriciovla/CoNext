<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Ícono de app: marca sobre la baldosa crema. Sin <mask>: Chrome no aplica
    máscaras en el favicon de la pestaña, deja el SVG en blanco y pone la
    inicial del <title> — la C de conext. El hueco entre las dos formas se
    pinta con la misma crema de la baldosa, que es lo único que el renderer
    de la pestaña entiende.
  -->
  <rect width="512" height="512" rx="112" ry="112" fill="#F7F2E8" />
  <g transform="translate(256 256) scale(1.06) translate(-256 -256)">
    <rect x="197" y="127" width="190" height="190" rx="74" ry="74" transform="rotate(-12 292 222)" fill="#14140f" />
    <rect x="119" y="205" width="190" height="190" rx="74" ry="74" transform="rotate(8 214 300)" fill="#F7F2E8" stroke="#F7F2E8" stroke-width="30" />
    <rect x="119" y="205" width="190" height="190" rx="74" ry="74" transform="rotate(8 214 300)" fill="#14140f" />
  </g>
</svg>
